<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhyBLE 接線引導</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 實驗課的工作卡，一步一步、看圖就能接
   IDEA: 桌上的麵包板照片被改畫成教學圖：每一步只亮起這一步要接的線
   PICTURE: 左邊 ESP32、右邊麵包板與元件，杜邦線依步驟出現，目前這條會發光
   COLOUR and TYPE: 淺灰藍桌面、米白麵包板、真實線色（紅=正、黑=地、彩色=訊號），重點色電光藍；Noto Sans TC + JetBrains Mono 標腳位
   LAYOUT: 上方工具列（選感測器、板子、立體/平面），中間大圖，右側步驟卡；900px 以下圖在上、步驟在下 */
:root{color-scheme:light dark;--bg:light-dark(#e7edf3,#11161b);--panel:light-dark(#fbfaf7,#181e24);--ink:light-dark(#17202a,#e9eef3);--mute:light-dark(#5a6673,#a1adb9);--line:light-dark(#d9dfe5,#2c353e);--bar:light-dark(#1d2732,#0b0f13);--acc:#2f6fec;--warnbg:light-dark(#fff4cc,#3a3010);--warnink:light-dark(#6b4d00,#ffe08a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
.top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:12px;padding:10px max(2vw,12px);flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:900;white-space:nowrap}
.top select{height:44px;border-radius:10px;border:1px solid #ffffff40;background:#ffffff12;color:#fff;font:700 16px "Noto Sans TC",sans-serif;padding:0 10px;max-width:100%}
.top select option{color:#111;background:#fff}
.top .sp{flex:1}
.top a{color:#fff;font-weight:700}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;border:1px solid #ffffff40}
.seg button{height:42px;padding:0 14px;border:0;background:transparent;color:#fff;font:700 15px "Noto Sans TC",sans-serif;cursor:pointer}
.seg button.on{background:#fff;color:var(--bar)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.stage{position:relative;overflow:auto;padding:16px;display:flex;align-items:center;justify-content:center}
.stage .tools{position:absolute;right:16px;top:12px;display:flex;gap:8px;z-index:2}
.chip{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px "Noto Sans TC",sans-serif;padding:0 12px;cursor:pointer;box-shadow:0 2px 8px #0001}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.wrap3d{width:100%;max-width:1280px;transition:transform .5s ease;transform-origin:50% 60%}
.wrap3d.tilt{transform:perspective(1400px) rotateX(38deg) rotateZ(-8deg) scale(.92)}
@media (prefers-reduced-motion:reduce){.wrap3d{transition:none}}
svg#board{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 24px #0002)}
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.steps{padding:20px 22px;overflow:auto;flex:1}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prog b{font-size:15px}.prog b span{font-size:26px;font-weight:900}
.dots{display:flex;gap:5px;flex:1}
.dots i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--ink)}.dots i.c{background:var(--acc)}
.steps h2{font-size:22px;line-height:1.3;margin:6px 0 8px;font-weight:900;text-wrap:balance}
.steps p{margin:0 0 12px;color:var(--mute)}
.conn{list-style:none;padding:0;margin:0 0 12px}
.conn li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.sw{width:22px;height:8px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px #0003}
.conn code{font:700 14px "JetBrains Mono",monospace;white-space:nowrap}
.warn{background:var(--warnbg);color:var(--warnink);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;margin:0 0 12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card b{display:block;margin-bottom:4px}
.card ul{margin:0;padding-left:20px;color:var(--mute);font-size:15px}
.mode{display:inline-block;background:var(--acc);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px}
.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.nav button{height:54px;border-radius:12px;font:900 18px "Noto Sans TC",sans-serif;cursor:pointer}
#prev{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
#next{background:var(--bar);color:#fff;border:0}
:root[data-theme=dark] #next{background:var(--acc)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) #next{background:var(--acc)}}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:3px solid #6ea0ff;outline-offset:2px}
/* svg styles */
.w{fill:none;stroke-linecap:round;stroke-linejoin:round}
.it{transition:opacity .25s}
.it.past{opacity:.55}.it.future{opacity:0;pointer-events:none}
.it.cur .w{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 0 #2f6fec00)}to{filter:drop-shadow(0 0 6px #2f6fec)}}
@media (prefers-reduced-motion:reduce){.it.cur .w{animation:none}}
.lbl{font:700 11px "JetBrains Mono",monospace}
.pinhi{fill:none;stroke:#ff9d00;stroke-width:3}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}.side{border-left:0;border-top:1px solid var(--line)}.stage{padding:52px 8px 8px}}
</style>
</head>
<body>
<header class="top">
  <h1>接線引導</h1>
  <select id="msel" aria-label="選擇感測器"></select>
  <select id="bsel" aria-label="ESP32 板子">
    <option value="30">ESP32 DevKit 30 腳</option>
    <option value="38">ESP32 DevKitC 38 腳</option>
  </select>
  <div class="sp"></div>
  <div class="seg" role="group" aria-label="視角"><button id="v3d">立體</button><button id="v2d" class="on">平面</button></div>
  <a href="index.html">燒錄站</a>
</header>
<main>
  <section class="stage">
    <div class="tools"><button class="chip" id="all">顯示完整接線</button></div>
    <div class="wrap3d" id="w3"><svg id="board" viewBox="0 0 1400 700" role="img" aria-label="ESP32 與麵包板接線圖"></svg></div>
  </section>
  <aside class="side">
    <div class="steps" id="steps"></div>
    <div class="nav"><button id="prev">‹ 上一步</button><button id="next">下一步 ›</button></div>
  </aside>
</main>

<script>
{
const $=id=>document.getElementById(id);
const S=$('board');
const P=22;                       // 麵包板孔距
const BX=330,BY=74;               // 麵包板左上
const EX=60,EY=74;                // ESP32 左上
const COLS=30;
const ROWS={j:0,i:1,h:2,g:3,f:4,e:6,d:7,c:8,b:9,a:10};
const cx=c=>BX+40+(c-1)*P;
const ry=r=>r==='+'?BY+392:r==='-'?BY+414:r==='T+'?BY+22:r==='T-'?BY+44:BY+82+ROWS[r]*P;
const hole=(c,r)=>[cx(c),ry(r)];
const hname=(c,r)=>r==='+'?`下方 + 軌（第 ${c} 孔附近）`:r==='-'?`下方 − 軌（第 ${c} 孔附近）`:`${c}${r}`;
const C={red:'#e23b2e',black:'#22262b',yellow:'#f2c230',green:'#1f9d55',blue:'#2f6fec',orange:'#f28a1d',purple:'#8a4fd8',white:'#f4f4f4',brown:'#8a5a2b',gray:'#9aa3ab'};
const CN={red:'紅',black:'黑',yellow:'黃',green:'綠',blue:'藍',orange:'橙',purple:'紫',white:'白',brown:'棕',gray:'灰'};

// ---------- ESP32 腳位（俯視、天線朝上、USB 朝下） ----------
const BOARDS={
 '30':{name:'ESP32 DevKit V1（30 腳）',
  L:[['EN','EN'],['VP','36'],['VN','39'],['D34','34'],['D35','35'],['D32','32'],['D33','33'],['D25','25'],['D26','26'],['D27','27'],['D14','14'],['D12','12'],['D13','13'],['GND','GND'],['VIN','VIN']],
  R:[['D23','23'],['D22','22'],['TX0','1'],['RX0','3'],['D21','21'],['D19','19'],['D18','18'],['D5','5'],['TX2','17'],['RX2','16'],['D4','4'],['D2','2'],['D15','15'],['GND','GND'],['3V3','3V3']]},
 '38':{name:'ESP32 DevKitC（38 腳）',
  L:[['3V3','3V3'],['EN','EN'],['VP','36'],['VN','39'],['34','34'],['35','35'],['32','32'],['33','33'],['25','25'],['26','26'],['27','27'],['14','14'],['12','12'],['GND','GND'],['13','13'],['D2','SD2'],['D3','SD3'],['CMD','CMD'],['5V','5V']],
  R:[['GND','GND'],['23','23'],['22','22'],['TX','1'],['RX','3'],['21','21'],['GND','GND2'],['19','19'],['18','18'],['5','5'],['17','17'],['16','16'],['4','4'],['0','0'],['2','2'],['15','15'],['D1','SD1'],['D0','SD0'],['CLK','CLK']]}
};
let board='30';
function espGeom(){
  const B=BOARDS[board],n=B.L.length,W=180,H=n*P+130;
  return {B,n,W,H,x0:EX,y0:EY,lx:EX+18,rx:EX+W-18,py:i=>EY+92+i*P};
}
function pinPos(key){
  const g=espGeom();
  let i=g.B.R.findIndex(p=>p[1]===key);
  if(key==='GND'){ // 靠近 3V3 的那一側
    const side3=g.B.R.some(p=>p[1]==='3V3')?'R':'L';
    const arr=g.B[side3];i=arr.findIndex(p=>p[1]==='GND');
    return {x:side3==='R'?g.rx:g.lx,y:g.py(i),side:side3,label:'GND'};
  }
  if(i>=0)return {x:g.rx,y:g.py(i),side:'R',label:g.B.R[i][0]};
  i=g.B.L.findIndex(p=>p[1]===key);
  return {x:g.lx,y:g.py(i),side:'L',label:g.B.L[i][0]};
}
const pinText=k=>{const p=pinPos(k);return k==='3V3'||k==='GND'?`ESP32「${p.label}」`:`ESP32「${p.label}」(GPIO${k})`};

// ---------- 情境資料 ----------
// 每個項目：s = 第幾步出現
const POWER=[
 {s:1,t:'esp',pin:'3V3',to:[2,'+'],color:'red'},
 {s:1,t:'esp',pin:'GND',to:[3,'-'],color:'black'}];
const MODES={
 led:{name:'LED 燈號測試（外接 LED）',phy:null,
  parts:['ESP32 開發板 ×1','麵包板 ×1','LED ×1（任意顏色）','220 Ω 電阻 ×1（紅紅棕）','公對公杜邦線 ×3'],
  items:[...POWER.filter(x=>x.pin==='GND'),
   {s:2,t:'res',a:[8,'g'],b:[12,'g'],val:'220Ω',bands:['#c0392b','#c0392b','#7b4a1e']},
   {s:3,t:'led',a:[12,'i'],k:[13,'i'],col:'#ff3b30'},
   {s:4,t:'esp',pin:'2',to:[8,'f'],color:'orange'},
   {s:5,t:'jmp',from:[13,'f'],to:[13,'-'],color:'black'}],
  steps:[
   {h:'準備材料',p:'這個練習不用感測器：外接一顆 LED，看它是否跟板子上的藍燈一起閃，確認燒錄和組別都正常。'},
   {h:'GND 接到麵包板 − 軌',p:'只需要接地線（LED 用 GPIO2 供電）。'},
   {h:'放 220 Ω 電阻',p:'電阻兩腳插 8g 和 12g，方向不拘。',warn:'一定要有電阻，否則 LED 和 ESP32 都可能燒壞。'},
   {h:'放 LED',p:'長腳（+，陽極）插 12i，短腳（−，陰極）插 13i。12 號直排和電阻相連。',warn:'LED 有方向：長腳接電阻那側，短腳接地。'},
   {h:'GPIO2 接到電阻',p:'這條線把 ESP32 的訊號送到電阻。'},
   {h:'LED 短腳接地',p:'從 13f 接一條黑線到下方 − 軌。'},
   {h:'完成！',p:'插上 USB，LED 應會先閃出組別號碼（長閃 = 十位、短閃 = 個位），之後每秒閃一下；phyphox 連上後恆亮。'}]},
 dsprobe:{name:'溫度：DS18B20 防水探頭（三條線）',phy:'1 溫度',
  parts:['ESP32 開發板 ×1','麵包板 ×1','DS18B20 防水探頭 ×1','4.7 kΩ 電阻 ×1（黃紫紅）','公對公杜邦線 ×5'],
  items:[...POWER,
   {s:2,t:'probe',pins:[[15,'h','yellow','DQ'],[16,'h','red','VCC'],[17,'h','black','GND']]},
   {s:3,t:'res',a:[15,'g'],b:[16,'g'],val:'4.7kΩ',bands:['#e6c31a','#7a3fb0','#c0392b']},
   {s:4,t:'jmp',from:[16,'f'],to:[16,'+'],color:'red'},
   {s:4,t:'jmp',from:[17,'f'],to:[17,'-'],color:'black'},
   {s:5,t:'esp',pin:'4',to:[15,'f'],color:'yellow'}],
  steps:[
   {h:'準備材料',p:'探頭的三條線：紅 = VCC、黑 = GND、黃 = DQ（資料）。少數產品顏色不同，請看包裝說明。'},
   {h:'電源軌：3.3V 與 GND',p:'把 ESP32 的 3.3V 接到下方 + 軌（紅線），GND 接到 − 軌（黑線）。之後所有元件都從這兩條軌取電。',warn:'接 3.3V，不要接 VIN / 5V。'},
   {h:'插入探頭三條線',p:'黃線插 15h、紅線插 16h、黑線插 17h。',warn:'探頭是多股細線，不好插的話先擰緊或接杜邦端子。'},
   {h:'加 4.7 kΩ 上拉電阻',p:'電阻插 15g 和 16g，把 DQ 和 VCC 連起來。沒有這顆電阻會讀不到溫度。'},
   {h:'探頭接電源',p:'16f（紅線那排）接到 + 軌；17f（黑線那排）接到 − 軌。'},
   {h:'資料線接到 GPIO4',p:'15f（黃線那排）接到 ESP32 的 GPIO4。'},
   {h:'完成！',p:'在 phyphox 的「換感測器」選「1 溫度」。可以並聯第二支探頭（三條線插在同樣三排），會顯示溫度 2。'}]},
 dsmod:{name:'溫度：DS18B20 模組板',phy:'1 溫度',
  parts:['ESP32 開發板 ×1','麵包板 ×1','DS18B20 模組板（含探頭）×1','公對公杜邦線 ×5'],
  items:[...POWER,
   {s:2,t:'mod',cols:[15,16,17],name:'DS18B20',pins:['DQ','VCC','GND'],color:'#1f2a36',h:78,term:true},
   {s:3,t:'jmp',from:[16,'g'],to:[16,'+'],color:'red'},
   {s:3,t:'jmp',from:[17,'g'],to:[17,'-'],color:'black'},
   {s:4,t:'esp',pin:'4',to:[15,'g'],color:'yellow'}],
  steps:[
   {h:'準備材料',p:'模組板上已有 4.7 kΩ 上拉電阻，不用另外加。'},
   {h:'電源軌：3.3V 與 GND',p:'ESP32 的 3.3V 接 + 軌（紅），GND 接 − 軌（黑）。',warn:'接 3.3V，不要接 VIN / 5V。'},
   {h:'插入模組板',p:'三支腳插 15j、16j、17j，板子朝圖的上方。',warn:'圖上的腳位順序是 DQ / VCC / GND；請以你手上板子的絲印為準，順序不同就跟著換線。'},
   {h:'模組接電源',p:'VCC 那排（16g）接 + 軌，GND 那排（17g）接 − 軌。'},
   {h:'DQ 接到 GPIO4',p:'DQ 那排（15g）接到 ESP32 的 GPIO4。'},
   {h:'完成！',p:'在 phyphox 的「換感測器」選「1 溫度」。'}]},
 gate:{name:'光閘：XD-51 槽型光耦',phy:'2 光閘計時',
  parts:['ESP32 開發板 ×1','麵包板 ×1','XD-51 測速（槽型光耦）模組 ×1','公對公杜邦線 ×5','擋光片（紙卡、尺）'],
  items:[...POWER,
   {s:2,t:'mod',cols:[18,19,20,21],name:'XD-51',pins:['VCC','GND','DO','AO'],color:'#1d4fa3',h:70,slot:true},
   {s:3,t:'jmp',from:[18,'g'],to:[18,'+'],color:'red'},
   {s:3,t:'jmp',from:[19,'g'],to:[19,'-'],color:'black'},
   {s:4,t:'esp',pin:'27',to:[20,'g'],color:'green'}],
  steps:[
   {h:'準備材料',p:'槽型光耦的 U 形槽一邊發紅外光、一邊接收；東西穿過槽時就會「遮光」。'},
   {h:'電源軌：3.3V 與 GND',p:'ESP32 的 3.3V 接 + 軌（紅），GND 接 − 軌（黑）。',warn:'用 3.3V 供電，輸出才不會超過 ESP32 能承受的電壓。'},
   {h:'插入 XD-51 模組',p:'四支腳插 18j～21j，U 形槽朝圖的上方。',warn:'圖上的腳位順序是 VCC / GND / DO / AO；請以板子絲印為準。AO 不用接。'},
   {h:'模組接電源',p:'VCC 那排（18g）接 + 軌，GND 那排（19g）接 − 軌。'},
   {h:'DO 接到 GPIO27',p:'DO 那排（20g）接到 ESP32 的 GPIO27。'},
   {h:'完成！',p:'在 phyphox 選「2 光閘計時」。開機時槽內不要有東西。速度 = 擋光片寬度 ÷ 遮光時間；單擺週期看「間隔」。'}]},
 hall:{name:'轉速：霍爾感測器模組',phy:'3 轉速',
  parts:['ESP32 開發板 ×1','麵包板 ×1','霍爾感測器模組 ×1','小磁鐵 ×1（貼在轉盤上）','公對公杜邦線 ×5'],
  items:[...POWER,
   {s:2,t:'mod',cols:[18,19,20],name:'HALL',pins:['VCC','GND','DO'],color:'#1d4fa3',h:66},
   {s:3,t:'jmp',from:[18,'g'],to:[18,'+'],color:'red'},
   {s:3,t:'jmp',from:[19,'g'],to:[19,'-'],color:'black'},
   {s:4,t:'esp',pin:'26',to:[20,'g'],color:'blue'}],
  steps:[
   {h:'準備材料',p:'磁鐵經過霍爾感測器時，DO 腳會改變電位；每轉一圈經過一次，就能算出轉速。'},
   {h:'電源軌：3.3V 與 GND',p:'ESP32 的 3.3V 接 + 軌（紅），GND 接 − 軌（黑）。'},
   {h:'插入霍爾模組',p:'三支腳插 18j～20j，感測頭朝圖的上方。',warn:'圖上的腳位順序是 VCC / GND / DO；請以板子絲印為準。有 AO 腳的不用接。'},
   {h:'模組接電源',p:'VCC 那排（18g）接 + 軌，GND 那排（19g）接 − 軌。'},
   {h:'DO 接到 GPIO26',p:'DO 那排（20g）接到 ESP32 的 GPIO26。'},
   {h:'完成！',p:'在 phyphox 選「3 轉速」，並用滑桿設定轉盤上的磁鐵數。開機時磁鐵不要停在感測器前。'}]},
 ina:{name:'電壓電流：INA219（量 LED 電路）',phy:'4 電壓電流',
  parts:['ESP32 開發板 ×1','麵包板 ×1','INA219 模組 ×1','220 Ω 電阻 ×1（紅紅棕）','LED ×1','公對公杜邦線 ×8'],
  items:[...POWER,
   {s:2,t:'mod',cols:[8,9,10,11,12,13],name:'INA219',pins:['VCC','GND','SCL','SDA','VIN−','VIN+'],color:'#1d4fa3',h:84,term:true},
   {s:3,t:'jmp',from:[8,'g'],to:[8,'+'],color:'red'},
   {s:3,t:'jmp',from:[9,'g'],to:[9,'-'],color:'black'},
   {s:4,t:'esp',pin:'22',to:[10,'g'],color:'yellow'},

function roundPath(pts,r){
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const l1=Math.hypot(x1-x0,y1-y0)||1,l2=Math.hypot(x2-x1,y2-y1)||1,rr=Math.min(r,l1/2,l2/2);

function espRoute(pin,tx,ty,lane,offboard){

    if(p.side==='R'){const lx=G.x0+G.W+12+lane*7;return [[p.x,p.y],[lx,p.y],[lx,ty],[tx,ty]];}
    const lx=G.x0-12-lane*7,by=G.y0+G.H+30+lane*8;return [[p.x,p.y],[lx,p.y],[lx,by],[ex,by],[ex,ty],[tx,ty]];
  }
  let pts;
  if(p.side==='R'){const lx=G.x0+G.W+12+lane*7;pts=[[p.x,p.y],[lx,p.y],[lx,gy]];}
  else{const lx=G.x0-12-lane*7,by=G.y0+G.H+30+lane*8;pts=[[p.x,p.y],[lx,p.y],[lx,by],[ex,by],[ex,gy]];}

  if(it.t==='esp'){const to=typeof it.to==='string'?'L9110S「'+it.to.slice(2)+'」':'麵包板 '+hname(...it.to);return [it.color,`${pinText(it.pin)} → ${to}`]}
  if(it.t==='jmp')return [it.color,`麵包板 ${hname(...it.from)} → ${hname(...it.to)}`];
  if(it.t==='lw')return [it.color,`L9110S「${it.from.slice(2)}」→ 麵包板 ${hname(...it.to)}`];
  return null;
}

function render(){
  const M=MODES[modeKey],N=M.steps.length;
  if(step>=N)step=N-1;
  S.innerHTML='';
  const used=new Set(M.items.filter(it=>it.t==='esp'&&(showAll||it.s<=step)).map(it=>it.pin+'@'+pinPos(it.pin).side));
  const gb=el('g',{});drawBreadboard(gb);
  const ge=el('g',{});drawESP(ge,used);
  const layers={parts:el('g',{}),wires:el('g',{})};
  let lane=0;
  M.items.forEach(it=>{
    const cls='it '+(showAll?'':(it.s<step?'past':it.s===step?'cur':'future'));
    const isWire=['esp','jmp','lw'].includes(it.t);
    const g=el('g',{class:cls},isWire?layers.wires:layers.parts);
    if(it.t==='esp'){
      let tx,ty;
      if(typeof it.to==='string'){[tx,ty]=lpin(it.to.slice(2));tx-=6}else [tx,ty]=hole(...it.to);
      drawWire(g,espRoute(it.pin,tx,ty,lane++,typeof it.to==='string'),it.color);
      const p=pinPos(it.pin);el('rect',{class:'pinhi',x:p.x-9,y:p.y-9,width:18,height:18,rx:4},g);
    }else if(it.t==='jmp'){
      const [x1,y1]=hole(...it.from),[x2,y2]=hole(...it.to);
      const mid=(y1+y2)/2;drawWire(g,[[x1,y1],[x1+8,mid],[x2,y2]],it.color);
    }else if(it.t==='lw'){
      const [x1,y1]=lpin(it.from.slice(2)),[x2,y2]=hole(...it.to);
      drawWire(g,[[x1-6,y1],[x1-40,y1],[x1-40,y2+30],[x2,y2+30],[x2,y2]],it.color);
    }
    else if(it.t==='res')resistor(g,it.a,it.b,it.val,it.bands);
    else if(it.t==='led')led(g,it.a,it.k,it.col);
    else if(it.t==='mod')module(g,it);
    else if(it.t==='probe')probe(g,it);
    else if(it.t==='l9110')drawL9110(g);
    else if(it.t==='bat')drawBattery(g);
  });
  // 步驟卡
  const st=M.steps[step];
  const conns=M.items.filter(it=>it.s===step).map(endpointText).filter(Boolean);
  const holes=M.items.filter(it=>it.s===step&&it.t==='res').map(it=>`電阻 ${it.val}：${it.a.join('')} ↔ ${it.b.join('')}`)
    .concat(M.items.filter(it=>it.s===step&&it.t==='led').map(it=>`LED：長腳 ${it.a.join('')}、短腳 ${it.k.join('')}`))
    .concat(M.items.filter(it=>it.s===step&&it.t==='mod').map(it=>`${it.name}：`+it.cols.map((c,i)=>`${it.pins[i]} ${c}j`).join('、')));
  $('steps').innerHTML=`
    <div class="prog"><b>步驟 <span>${step+1}</span> / ${N}</b><div class="dots">${M.steps.map((_,i)=>`<i class="${i<step?'d':i===step?'c':''}"></i>`).join('')}</div></div>
    <h2>${st.h}</h2>
    <p>${st.p}</p>
    ${st.warn?`<p class="warn">⚠ ${st.warn}</p>`:''}
    ${conns.length?`<ul class="conn">${conns.map(([c,t])=>`<li><span class="sw" style="background:${wireColor(c)}"></span><span>${CN[c]||''}線：<code>${t}</code></span></li>`).join('')}</ul>`:''}
    ${holes.length?`<div class="card"><b>插孔位置</b><ul>${holes.map(h=>`<li>${h}</li>`).join('')}</ul></div>`:''}
    ${step===0?`<div class="card"><b>材料</b><ul>${M.parts.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      <div class="card"><b>板子擺法</b><ul><li>${BOARDS[board].name}：天線朝上、USB 朝下</li><li>麵包板直排用數字（1～30）、橫列用字母（a～j）表示，例如 15g</li><li>同一直排的 a–e 相通、f–j 相通；下方兩條長軌 + / − 整排相通</li></ul></div>`:''}
    ${M.phy?`<p>phyphox「換感測器」要選：<span class="mode">${M.phy}</span></p>`:''}`;
  $('prev').disabled=step===0;
  $('next').textContent=step===N-1?'重新開始 ↺':'下一步 ›';
  $('all').classList.toggle('on',showAll);
}
$('prev').onclick=()=>{if(step>0){step--;render()}};
$('next').onclick=()=>{const N=MODES[modeKey].steps.length;step=step<N-1?step+1:0;render()};
$('msel').onchange=e=>{modeKey=e.target.value;step=0;try{localStorage.setItem('wire-mode',modeKey)}catch(_){}render()};
$('bsel').onchange=e=>{board=e.target.value;try{localStorage.setItem('wire-board',board)}catch(_){}render()};
$('all').onclick=()=>{showAll=!showAll;render()};
$('v3d').onclick=()=>{$('w3').classList.add('tilt');$('v3d').classList.add('on');$('v2d').classList.remove('on')};
$('v2d').onclick=()=>{$('w3').classList.remove('tilt');$('v2d').classList.add('on');$('v3d').classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click()});
render();
}
</script>
</body>
</html>
